[project]
name = "sleeping-bird-api"
version = "1.0.0"
description = "FastAPI backend for Sleeping Bird — Gemini-powered metric suggestions."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
